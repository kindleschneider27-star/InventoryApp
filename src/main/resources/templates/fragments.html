<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head">
    <meta charset="UTF-8">
    <title th:text= "'MCC Bookstore :: '  + ${pageTitle ?: 'Home'}"> </title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>
<div th:fragment="header">
    <header><h1>MCC Bookstore</h1></header>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/list}">Item Search</a>
        <a sec:authorize="hasAnyRole('MNGR','ADMIN')" th:href="@{/register}">Add Item</a>
        <a sec:authorize="isAnonymous()" th:href="@{/login}">Log In</a>
        <form sec:authorize="isAuthenticated()" method="post" th:action="@{/logout}">
            <input type="submit" value="Log Out">
        </form>
    </nav>
    <div sec:authorize="isAuthenticated()">
        Welcome <span sec:authentication="principal.fullName">FULL NAME<</span>
    </div>
</div>

</body>

<footer th:fragment="footer">
    @ MCC Bookstore 2026<br>
    <a href="mailto:info@mccbookstore.com">Contact Us</a>
</footer>


</html>
