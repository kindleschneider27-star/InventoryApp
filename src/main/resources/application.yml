spring:
  application:
    name: InventoryApp
  servlet:
    multipart:
      max-file-size: 5MB
  data:
    rest:
      base-path: /data-api


logging:
  file:
    name: log/inventory-app.log
  logback:
    rollingpolicy:
      file-name-pattern: "logs/inventory-app-%d{yyyy-MM-dd}.%i.log"
      max-file-size: 10MB
      max-history: 30


