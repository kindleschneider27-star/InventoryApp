spring:
  application:
    name: InventoryApp
  servlet:
    multipart:
      max-file-size: 5MB



logging:
  file:
    name: log/inventory-app.log
  logback:
    rollingpolicy:
      file-name-pattern: "logs/inventory-app-%d{yyyy-MM-dd}.%i.log"
      max-file-size: 10MB
      max-history: 30

item:
  security:
    jwt:
      secret: "${JWT_SECRET}"
      issuer: "inventory-app"
      audience: "inventory-app-api"
      token-duration: "${JWT_DURATION:8h}"
